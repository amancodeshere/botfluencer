[project]
name = "botfluencer"
version = "0.1.0"
description = "Capture the Narrative team runtime and experiment infrastructure"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.16,<2",
    "capturethenarrative==0.5.0",
    "fastapi>=0.115,<1",
    "httpx>=0.28.1,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.8,<3",
    "sqlalchemy[asyncio]>=2.0.40,<2.1",
    "uvicorn>=0.34,<1",
]

[project.scripts]
botfluencer = "botfluencer.cli:main"

[project.optional-dependencies]
training = [
    "torch==2.14.1",
    "transformers==5.20.2",
    "datasets==5.1.0",
    "accelerate==1.15.0",
    "peft==0.21.2",
    "scikit-learn>=1.7,<2",
    "sentencepiece>=0.2,<1",
    "safetensors>=0.6,<1",
    "pandas>=2.3,<4",
    "matplotlib>=3.10,<4",
    "jupyterlab>=4.4,<5",
    "ipykernel>=6.30,<8",
    "tensorboard>=2.20,<3",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", extra = "training", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.26,<2",
    "ruff>=0.11,<1",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: requires a dedicated disposable Postgres database"]
