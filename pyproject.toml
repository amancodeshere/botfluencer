[project]
name = "botfluencer"
version = "0.1.0"
description = "Capture the Narrative team runtime and experiment infrastructure"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.16,<2",
    "capturethenarrative==0.4.0",
    "fastapi>=0.115,<1",
    "httpx>=0.28.1,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.8,<3",
    "sqlalchemy[asyncio]>=2.0.40,<2.1",
    "uvicorn>=0.34,<1",
]

[project.scripts]
botfluencer = "botfluencer.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.26,<2",
    "ruff>=0.11,<1",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: requires a dedicated disposable Postgres database"]
