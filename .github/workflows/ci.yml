name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.5"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest -m 'not integration'

  integration:
    runs-on: ubuntu-latest
    concurrency:
      group: railway-postgres-integration
      cancel-in-progress: false
    env:
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.5"
      - run: uv sync --locked
      - name: Require isolated hosted database
        run: test -n "$TEST_DATABASE_URL" || { echo 'Configure the dedicated TEST_DATABASE_URL repository secret'; exit 1; }
      - run: uv run pytest -m integration

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: .railway/package-lock.json
      - run: npm --prefix .railway ci
      - run: npm --prefix .railway run check
