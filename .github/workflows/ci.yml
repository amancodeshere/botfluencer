name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        postgres: [16, 18]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: botfluencer
          POSTGRES_PASSWORD: botfluencer
          POSTGRES_DB: botfluencer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U botfluencer -d botfluencer_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://botfluencer:botfluencer@localhost:5432/botfluencer_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.5"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest
      - run: docker build -t botfluencer:ci .
      - run: docker run --rm botfluencer:ci botfluencer --version

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: .railway/package-lock.json
      - run: npm --prefix .railway ci
      - run: npm --prefix .railway run check
